<!DOCTYPE html>
<html>
  <head>
  <title>MB Movie-Base</title>
  <meta charset="utf-8"></meta>
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no"></meta>
  <link rel="icon" type="image/x-icon" href="../../images/MB_Icon_02.svg"></link>
  <link rel="stylesheet" href="../../assets/css/main.css"></link>
  <noscript><link rel="stylesheet" href="../../assets/css/noscript.css" /></noscript>
  <style>
    @font-face {font-family: "Freelancer";src: url("fonts/CreatoDisplay-Light.otf") format("truetype");font-weight: normal;font-style: normal;color: #ffffff;}
    body {font-family: "Freelancer";}
    tbody {width: 100%;height: auto;}
    tr {width: 100%;height: auto;}
    thead {display: none;} /* Verstecke den ursprünglichen Sortierungs-Header */

    .header_number_, .header_name___, .header_year___, .header_runtime, .header_fsk____ {width: 16%;height: 4rem;}
    .header_cover__ {width: 20%;height: 4rem;}

    .group_button {display: none;}
    .group_button.aktiv {display: block;}

    #group_button_container {width: 100%;height: auto;margin: auto;display: flex;flex-wrap: wrap;justify-content: space-around;align-items: center;}
    #group_button_container button {padding: 1em;margin: 0.2em;background-color: #222222;color: #dbdbdb;border: none;cursor: pointer;transition: background-color 0.2s;text-align: center;gap: 4px;white-space: nowrap;width: auto;}
    #group_button_container .sort_arrow {font-size: 0.8em;width: 1.2em;text-align: center;}
    #group_button_container button:hover {background-color: #444444;}
    #group_button_container button.active-group {background-color: #00ff00;color: #000000;font-weight: bold;}

    #search_container {text-align: center;}
    #search_container input {font-size: 1em;outline-color: none;background-color: #222222;color: #dbdbdb;border: none;}
    #search_container input:focus {outline: none;box-shadow: none;}

    .card_container {display: grid;grid-template-columns: repeat(auto-fill, minmax(8rem, 1fr));gap: 0.5em;}
    .movie_card {
      color: #ffffff;
      width: auto;height: auto;
      display: grid;grid-template-columns: auto auto;grid-template-rows: auto;
      background-color: #111111;
      border-radius: 0.5rem;border: 0.05rem solid #444444;position: relative;top: 0;
      margin: 0;cursor: pointer;transition: top 0.6s;
    }
    .movie_card:hover {border-color: #dddddd;top: -0.5rem;}

    .movie_poster {grid-column: 1 / span 2;grid-row: 1;width: 100%;height: auto;aspect-ratio: 2/3;display: flex;justify-content: center;align-items: center;border-top-left-radius: 0.5rem;border-top-right-radius: 0.5rem;}
    .movie_poster img {width: 100%;height: auto;object-fit: contain;border-top-left-radius: 0.5rem;border-top-right-radius: 0.5rem;}
    .movie_number_1 {grid-column: 1;grid-row: 2;font-size: 0.7rem;margin: 0.5rem 0.5rem 0 0;line-height: 1rem;text-align: right;}
    .movie_number_2 {grid-column: 2;grid-row: 2;font-size: 0.7rem;margin: 0.5rem 0.5rem;line-height: 1rem;}
    .movie_year_1 {grid-column: 1;grid-row: 3;font-size: 0.7rem;margin: 0 0.5rem 0.5rem 0;line-height: 1rem;text-align: right;}
    .movie_year_2 {grid-column: 2;grid-row: 3;font-size: 0.7rem;margin: 0 0.5rem 0.5rem;line-height: 1rem;}
    .movie_overlay {grid-column: 1 / span 2;grid-row: 1 / span 3;z-index: 1000;border-radius: 0.5rem;background: linear-gradient(50deg, #00000000, #00000000, #00000066, #00000000, #00000000, #00000000, #00000099, #00000000);transition: all 0.8s;}
    .movie_overlay:hover {opacity: 0;}

    .windowOverlay {width: 100vw;height: 100vh;position: fixed;inset: 0;background-color: #000000cc;z-index: 1000;overflow: hidden;padding: 0;margin: 0;display: grid;grid-template-columns: auto auto;grid-template-rows: auto;}
    .overlayImage {grid-column: 1;grid-row: 1;height: 100vh;}
    .overlayImage img {width: auto;height: 100%;}
    .overlayContainerLandscape {width: calc(100vw - ((100vh / 3) * 2));grid-column: 2;grid-row: 1;background: none;}
    .overlayContainerPortrait {position: fixed;inset: 0;background-color: #000000cc;z-index: 1002;overflow: hidden;padding: 0;margin: 0;background: linear-gradient(180deg, #000000cc, #000000cc, #000000ff, #000000ff, #000000ff);border: 0.05rem solid #999999;}

    .overlayInfo {width: calc(100vw - ((100vh / 3) * 2));height: calc(100vh - 4em);grid-column: 2;grid-row: 1;background-color: #00000000;display: grid;grid-template-columns: min-content auto min-content;grid-template-rows: min-content 2em auto min-content;margin: 4em 0 0 0;font-size: 0.8em;color: #dbdbdb;}
    .overlayTitle {grid-column: 1 / span 3;grid-row: 1;font-size: 1.5em;font-weight: bolder;text-align: center;padding: 0.5em 1em;}
    .overlayNumber1 {grid-column: 1;grid-row: 2;padding: 0 2em;}.overlayNumber2 {grid-column: 2;grid-row: 2;padding: 0 0.5em;}
    .overlayYear1 {grid-column: 1;grid-row: 3;padding: 0 2em;}.overlayYear2 {grid-column: 2;grid-row: 3;padding: 0 0.5em;}
    .overlayFSK {width: 5em;height: 5em;grid-column: 3;grid-row: 2 / span 2;text-align: right;}.overlayFSK img {width: 100%;height: 100%;position: relative;top: -0.5em;left: -0.5em;}
    .overlayPlot {grid-column: 1 / span 3;grid-row: 4;text-align: justify;padding: 2em;font-size: 0.8em;border-radius: 0.5rem;background-color: #000000;border: 1px solid #444444;margin: 1rem;}

    .exitButton {width: 4vh;height: 4vh;top: 1vh;left: calc(100vw - 5vh);background-color: #111111;color: #ffffff;font-size: 1.5vh;font-weight: 400;
      border-radius: 0.5rem;border: 1px solid #444444;transition: all 0.5s ease;cursor: pointer;
      display: inline-flex;user-select: auto;position: fixed;overflow: hidden;align-items: center;justify-content: center;}
    .exitButton:hover {transform: scale(0.95);background-color: #cccccc;color: #000000;}
    .exitButton:active {transform: scale(0.96);}

  </style>

</head>
<body id="body" onload="window.location.href = '#mb_movie_base';load_moviebase();" class="is-preload">
  <div id="wrapper">
    
    <nav id="nav">
      <a href="../../index.html"><img class="mb_icon" src="../../images/MB_Icon_02.svg"></img><span>Home</span></a>
      <a href="../../Web-Tools/web-tools.html"><img class="mb_icon" src="../../images/Web_Icon_01.png"></img><span>Web-Tools</span></a>
      <a href="../../Local-Tools/local-tools.html"><img class="mb_icon" src="../../images/CMD_Icon_01.png"></img><span>Local-Tools</span></a>
	  <a href="../../Games/games.html"><img class="mb_icon" src="../../images/Games_Icon_01.png"></img><span>Games</span></a>
      <a href="#mb_movie_base"><img class="mb_icon" src="icon_01.png"></img><span>Movie-Base</span></a>
    </nav>
    
    <div id="main">
      <article id="mb_movie_base" class="panel">
        <header><h2>MB Movie-Base</h2></header>
        <div id="output"></div>
      </article>
    </div>

    <div id="footer"><ul class="copyright"><li>&copy; Master B</li></ul></div>

  </div>
</body>

<script src="../../assets/js/jquery.min.js"></script>
<script src="../../assets/js/browser.min.js"></script>
<script src="../../assets/js/breakpoints.min.js"></script>
<script src="../../assets/js/util.js"></script>
<script src="../../assets/js/main.js"></script>
<script>
  let current_data = [];
  let current_group = 'Name';
  let current_sort_direction = 'asc';

  async function load_moviebase() {
    try {
      const response = await fetch("series.json");
      if (!response.ok) throw new Error("series.json konnte nicht geladen werden.");
      current_data = await response.json();
      load_navigation();
      load_table_data(current_data);
    }
    catch(err) {
      document.getElementById("output").innerHTML = "<h3>Fehler</h3><p>" + err.message + "</p>";
      console.error(err);
    }
  }

  function load_navigation() {
    const groups_container = document.createElement('nav');
    groups_container.id = 'group_button_container';
    const group_description = ['Nummer', 'Name', '0-9', ...'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split(''), 'Zufall'];
    group_description.forEach(z => {
      const btn = document.createElement('button');
      const group_button_text = document.createElement('span');
      group_button_text.className = 'button_text';
      group_button_text.textContent = z;
      const sort_arrow_symbol = document.createElement('span');
      sort_arrow_symbol.className = 'sort_arrow';
      sort_arrow_symbol.textContent = '  ';
      btn.appendChild(group_button_text);
      btn.appendChild(sort_arrow_symbol);
      btn.onclick = () => {
        const same_group = current_group === z;
        if (z === 'Zufall') {
          const random_movie = [current_data[Math.floor(Math.random() * current_data.length)]];
          current_group = 'Zufall';current_sort_direction = 'asc';load_table_data(random_movie, 'Zufall');show_group('Zufall');set_group_active();
        }
        else {
          if (same_group) {current_data.reverse();current_sort_direction = current_sort_direction === 'asc' ? 'desc' : 'asc';}
          else {current_group = z;current_sort_direction = 'asc';
            current_data.sort((a, b) => {
              if (z === 'Nummer') {const numA = parseInt(a[Object.keys(a)[0]]) || 0;const numB = parseInt(b[Object.keys(b)[0]]) || 0;return numA - numB;}
              else {const nameA = String(a[Object.keys(a)[1]] ?? '');const nameB = String(b[Object.keys(b)[1]] ?? '');return nameA.localeCompare(nameB, 'de');}
            });
          }
          load_table_data(current_data, z);set_group_active();
        }
      };
      groups_container.appendChild(btn);
    });

    const article = document.querySelector('article#mb_movie_base');
    article.insertBefore(groups_container, document.getElementById('output'));

    setTimeout(() => {
      const buttons = document.querySelectorAll('#group_button_container button');
      let maxWidth = 0;
      buttons.forEach(btn => {const width = btn.offsetWidth;if (width > maxWidth) maxWidth = width;});
      buttons.forEach(btn => {btn.style.width = maxWidth + 'px';});
    }, 0);

    const search_container_object = document.createElement('div');
    search_container_object.id = 'search_container';
    search_container_object.style.margin = '1em 0';
    const search_input = document.createElement('input');
    search_input.type = 'text';
    search_input.placeholder = 'Suche nach Titel...';
    search_input.id = 'search_input';
    search_input.style.padding = '0.5em';
    search_input.style.width = '100%';
    search_input.style.maxWidth = '100%';
    search_input.addEventListener('input', function () {search_in_table_data(this.value);});
    search_container_object.appendChild(search_input);
    article.insertBefore(search_container_object, document.getElementById('output'));
  }

  function load_table_data(data, group_extra = null) {
    const container = document.getElementById('output');container.innerHTML = '';
    const groups = {
      'Nummer': [], 'Name': [], 'Zufall': [], '0-9': [],
      ...Object.fromEntries('ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('').map(c => [c, []]))
    };
    for (const entry of data) {
      const name = entry.title ?? "";
      const letter_1 = name.charAt(0).toUpperCase();
      groups['Name'].push(entry);
      groups['Zufall'].push(entry);
      groups['Nummer'].push(entry);
      if (/[0-9]/.test(letter_1)) {groups['0-9'].push(entry);}
      else if (groups[letter_1]) {groups[letter_1].push(entry);}
    }

    for (const group_single in groups) {
      const groupDiv = document.createElement('div');
      groupDiv.id = 'group_single_' + group_single;
      groupDiv.className = 'group_button';
      if (group_single === (group_extra || 'Name')) {groupDiv.classList.add('aktiv');}
      let data = groups[group_single];
      if (group_single === 'Nummer') {
        data.sort((a, b) => {
          const numA = parseInt(a.id) || 0;
          const numB = parseInt(b.id) || 0;
          return current_sort_direction === 'asc' ? numA - numB : numB - numA;
        });
      }
      else if (group_single !== 'Zufall') {
        data.sort((a, b) => {
          const nameA = a.title ?? "";
          const nameB = b.title ?? "";
          return current_sort_direction === 'asc'
            ? nameA.localeCompare(nameB, 'de')
            : nameB.localeCompare(nameA, 'de');
        });
      }
      if (data.length > 0) {const table = generate_table_data(data);groupDiv.appendChild(table);}
      else {groupDiv.innerHTML = '<p>Keine Einträge gefunden...</p>';}
      container.appendChild(groupDiv);
    }
  }

  function set_group_active() {
    document.querySelectorAll('#group_button_container button').forEach(btn => {
      const group_button_text = btn.querySelector('.button_text');
      const sort_arrow_symbol_span = btn.querySelector('.sort_arrow');
      const text = group_button_text.textContent;
      btn.classList.remove('active-group');
      if (text === current_group) {btn.classList.add('active-group');sort_arrow_symbol_span.textContent = (text === 'Zufall') ? '' : (current_sort_direction === 'asc' ? '▼' : '▲');}
      else {sort_arrow_symbol_span.textContent = '  ';}
    });
  }

  function show_group(group_single) {
    current_group = group_single;
    document.querySelectorAll('.group_button').forEach(div => {div.classList.remove('aktiv');});
    const aktiv = document.getElementById('group_single_' + group_single);
    if (aktiv) aktiv.classList.add('aktiv');
    set_group_active();
  }

  function generate_table_data(data) {
    const container = document.createElement("div");
    container.className = "card_container";
    data.forEach(row => {
      const card = document.createElement("div");
      card.className = "movie_card";
      card.dataset.title = (row.title ?? "").toLowerCase();
      
      const title = document.createElement("div");
      title.className = "movie_title";
      title.innerHTML = row.title ?? "";
      
      const year_1 = document.createElement("div");
      year_1.className = "movie_year_1";
      year_1.innerHTML = "Jahr:";

      const year_2 = document.createElement("div");
      year_2.className = "movie_year_2";
      year_2.innerHTML = row.year ?? "";
      
      const number_1 = document.createElement("div");
      number_1.className = "movie_number_1";
      number_1.innerHTML = "Nummer:";
      
      const number_2 = document.createElement("div");
      number_2.className = "movie_number_2";
      number_2.innerHTML = row.id ?? "";
      
      const runtime_1 = document.createElement("div");
      runtime_1.className = "movie_runtime_1";
      runtime_1.innerHTML = "Laufzeit:";
      
      const runtime_2 = document.createElement("div");
      runtime_2.className = "movie_runtime_2";
      runtime_2.innerHTML = (row.runtime ?? "") + " Minuten";
      
      const plot = document.createElement("div");
      plot.className = "movie_plot";
      plot.innerHTML = row.plot ?? "";
      const poster = document.createElement("div");
      poster.className = "movie_poster";
      
      const image = document.createElement("img");
      image.src = row.poster;
      image.loading = "lazy";
      poster.appendChild(image);
      
      const fsk = document.createElement("div");
      fsk.className = "movie_fsk";
      fsk.innerHTML = '<img src="Scripts/' + row.mpaa + '.png" loading="lazy">';

      const overlay = document.createElement("div");
      overlay.className = "movie_overlay";
      overlay.onclick = () => createOverlay(row);
      
      card.appendChild(poster);
      card.appendChild(number_1);
      card.appendChild(number_2);
      card.appendChild(year_1);
      card.appendChild(year_2);
      card.appendChild(overlay);
      
      container.appendChild(card);
    });
    return container;
  }

  function search_in_table_data(search_index) {
    const group_div = document.getElementById("group_single_" + current_group);
    if (!group_div) return;
    const cards = group_div.querySelectorAll(".movie_card");
    const search = search_index.trim().toLowerCase();
    cards.forEach(card => {
      const title = card.dataset.title;
      card.style.display = (search === "" || title.includes(search)) ? "" : "none";
    });
  }

  function createOverlay(movie) {
    let mode = "";
    if (window.innerWidth >= window.innerHeight) {mode = "landscape";}
    else {mode = "portrait";}
    const windowOverlay = document.createElement("div");
    windowOverlay.className = "windowOverlay";

    const overlayImage = document.createElement("div");
    overlayImage.className = "overlayImage";
    overlayImage.innerHTML = '<img src="' + movie.poster + '" loading="lazy">';
    windowOverlay.appendChild(overlayImage);

    const overlayContainer = document.createElement("div");
    overlayContainer.className = "overlayContainerLandscape";
    const overlayInfo = document.createElement("div");
    overlayInfo.className = "overlayInfo";
    const overlayTitle = document.createElement("div");
    overlayTitle.className = "overlayTitle";
    overlayTitle.innerHTML = movie.title;
    overlayInfo.appendChild(overlayTitle);
    const overlayNumber1 = document.createElement("div");
    overlayNumber1.className = "overlayNumber1";
    overlayNumber1.innerHTML = "Nummer:";
    overlayInfo.appendChild(overlayNumber1);
    const overlayNumber2 = document.createElement("div");
    overlayNumber2.className = "overlayNumber2";
    overlayNumber2.innerHTML = movie.id;
    overlayInfo.appendChild(overlayNumber2);
    const overlayYear1 = document.createElement("div");
    overlayYear1.className = "overlayYear1";
    overlayYear1.innerHTML = "Jahr:";
    overlayInfo.appendChild(overlayYear1);
    const overlayYear2 = document.createElement("div");
    overlayYear2.className = "overlayYear2";
    overlayYear2.innerHTML = movie.year;
    overlayInfo.appendChild(overlayYear2);
    const overlayFSK = document.createElement("div");
    overlayFSK.className = "overlayFSK";
    overlayFSK.innerHTML = '<img src="Scripts/' + movie.mpaa + '.png" loading="lazy">';
    overlayInfo.appendChild(overlayFSK);
    const overlayPlot = document.createElement("div");
    overlayPlot.className = "overlayPlot";
    overlayPlot.innerHTML = movie.plot;
    overlayInfo.appendChild(overlayPlot);
    overlayContainer.appendChild(overlayInfo);
    windowOverlay.appendChild(overlayContainer);
    
    const exitButton = document.createElement("div");
    exitButton.className = "exitButton";
    exitButton.innerHTML = "✕";
    exitButton.onclick = () => removeOverlay();
    windowOverlay.appendChild(exitButton);

    
    /*
    
    if (mode === "landscape") {overlayInfo.style = "";}
    else {overlayInfo.style = "width: 100vw;height: auto;";}
    
    const overlayTable = document.createElement("div");
    overlayTable.className = "overlayTable";
    
    
    
    overlayInfo.appendChild(overlayTable);
    
    
    */

    document.body.appendChild(windowOverlay);
    document.body.style = "overflow: hidden;";
    console.log(movie);
  }
  function removeOverlay() {document.querySelector(".windowOverlay")?.remove();document.body.style = "overflow: scroll;";}

  function download_movie_files(movie) {
    if (!confirm("NFO-Datei und Poster herunterladen?")) return;
    downloadFile(`Movies/${movie.folder}/${movie.filename}.nfo`, `${movie.filename}.nfo`);
    downloadFile(movie.poster, `${movie.filename}-poster.jpg`);
  }
  function downloadFile(url, filename) {
    const link = document.createElement("a");
    link.href = url;
    link.download = filename;
    link.style.display = "none";
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
  }
</script>
