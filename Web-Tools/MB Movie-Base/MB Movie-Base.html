<!DOCTYPE html>
<html>
  <head>
  <title>MB Movie-Base</title>
  <meta charset="utf-8"></meta>
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no"></meta>
  <link rel="icon" type="image/x-icon" href="../../images/MB_Icon_02.svg"></link>
  <link rel="stylesheet" href="../../assets/css/main.css"></link>
  <noscript><link rel="stylesheet" href="../../assets/css/noscript.css" /></noscript>
  <style>
    @font-face {font-family: "Creato";src: url("Fonts/Creato.otf") format("truetype");font-weight: normal;font-style: normal;color: #ffffff;}
    @font-face {font-family: "FuturaHand";src: url("Fonts/FuturaHand.ttf") format("truetype");font-weight: normal;font-style: normal;color: #ffffff;}
    body {font-family: "Creato";}
    tbody {width: 100%;height: auto;}
    tr {width: 100%;height: auto;}
    thead {display: none;} /* Verstecke den ursprünglichen Sortierungs-Header */

    .header_number_, .header_name___, .header_year___, .header_runtime, .header_fsk____ {width: 16%;height: 4rem;}
    .header_cover__ {width: 20%;height: 4rem;}

    .group_button {display: none;}
    .group_button.aktiv {display: block;}
    .mb_button {width: 100%;height: auto;display: flex;align-items: center;justify-content: center;cursor: pointer;background-color: #222222;border-radius: 0.5rem;box-shadow: rgba(255, 255, 255, 0.3) 2px 2px 6px 1px inset;font-size: 1.2rem;box-sizing: border-box;}
    .mb_button:hover {font-size: 1.17rem;box-shadow: rgba(0, 0, 0, 0.7) 2px 2px 6px 1px inset;transition: all 0.2s;}

    #group_button_container {width: 100%;height: auto;margin: auto;display: flex;flex-wrap: wrap;justify-content: space-around;align-items: center;}
    #group_button_container button {padding: 1em;margin: 0.2em;background-color: #222222;color: #dbdbdb;border-radius: 0.5rem;box-shadow: rgba(255, 255, 255, 0.3) 2px 2px 6px 1px inset;cursor: pointer;transition: all 0.6s;text-align: center;gap: 4px;white-space: nowrap;width: auto;}
    #group_button_container .sort_arrow {font-size: 0.8em;width: 1.2em;text-align: center;}
    #group_button_container button:hover {box-shadow: rgba(0, 0, 0, 0.7) 2px 2px 6px 1px inset;}
    #group_button_container button.active-group {background-color: #00ff00;color: #000000;box-shadow: rgba(255, 255, 255, 0.3) 2px 2px 6px 1px inset;}

    #search_container {text-align: center;}
    #search_container input {background-color: #222222;padding: 0.5rem;cursor: text;border-radius: 0.5rem;border: 1px solid #444444;box-shadow: rgba(0, 0, 0, 0.7) 2px 2px 6px 1px inset;}
    #search_container input:focus {background-color: #222222;outline: none;border: 1px solid #dddddd;}

    .cardContainer {display: grid;grid-template-columns: repeat(auto-fill, minmax(8rem, 1fr));gap: 0.5em;}
    .movieCard {color: #ffffff;width: auto;height: auto;display: grid;grid-template-columns: auto auto;grid-template-rows: auto;background-color: #111111;border-radius: 0.5rem;border: 1px solid #444444;position: relative;top: 0;margin: 0;cursor: pointer;transition: top 0.6s;}
    .movieCard:hover {border-color: #dddddd;top: -0.5rem;}
    .moviePoster {grid-column: 1 / span 2;grid-row: 1;width: 100%;height: auto;aspect-ratio: 2/3;display: flex;justify-content: center;align-items: center;border-top-left-radius: 0.5rem;border-top-right-radius: 0.5rem;}
    .moviePoster img {width: 100%;height: auto;object-fit: contain;border-top-left-radius: 0.5rem;border-top-right-radius: 0.5rem;}
    .movieNumber {grid-column: 1;grid-row: 2;font-size: 0.7rem;margin: 0.5rem;line-height: 1rem;white-space: nowrap;display: flex;align-items: center;justify-content: center;}
    .movieNumber svg {position: relative;left: -0.25rem;width: 0.7rem;height: 0.7rem;}
    .movieYear {grid-column: 2;grid-row: 2;font-size: 0.7rem;margin: 0.5rem;line-height: 1rem;white-space: nowrap;display: flex;align-items: center;justify-content: center;}
    .movieYear svg {position: relative;left: -0.25rem;width: 0.7rem;height: 0.7rem;}
    .movieOverlay {grid-column: 1 / span 2;grid-row: 1 / span 3;z-index: 1000;border-radius: 0.5rem;background: linear-gradient(50deg, #00000000, #00000000, #00000066, #00000000, #00000000, #00000000, #00000099, #00000000);transition: all 0.8s;}
    .movieOverlay:hover {opacity: 0;}

    .overlayWindowLandscape {width: 100vw;height: 100vh;position: fixed;inset: 0;background-color: #000000cc;z-index: 1000;overflow: hidden;padding: 0;margin: 0;display: grid;grid-template-columns: auto auto;grid-template-rows: auto;}
    .overlayImageLandscape {grid-column: 1;grid-row: 1;height: 100vh;}
    .overlayImageLandscape img {width: auto;height: 100%;}
    .overlayContainerLandscape {width: calc(100vw - ((100vh / 3) * 2));grid-column: 2;grid-row: 1;background: none;}
    .overlayInfo1Landscape {width: calc(100vw - ((100vh / 3) * 2));height: 100vh;grid-column: 2;grid-row: 1;background-color: #00000000;display: grid;grid-template-columns: min-content min-content min-content min-content auto min-content min-content min-content;grid-template-rows: 5rem auto min-content;place-items: center;font-size: 1rem;color: #dbdbdb;}
    .overlayFSKLandscape {width: 5rem;height: 5rem;grid-column: 1;grid-row: 1;margin: 0 0 0 1rem;}.overlayFSKLandscape img {width: 100%;height: 100%;}
    .overlayNumberLandscape {height: 3.2rem;grid-column: 2;grid-row: 1;padding: 0 1rem;margin: 0 0.5rem 0 0;white-space: nowrap;display: flex;align-items: center;justify-content: center;border-radius: 0.5rem;background-color: #000000;border: 1px solid #444444;color: #dbdbdb;}
    .overlayNumberLandscape svg {position: relative;left: -0.5rem}
    .overlayYearLandscape {height: 3.2rem;grid-column: 3;grid-row: 1;padding: 0.5rem 1rem;margin: 0 0.5rem 0 0.5rem;white-space: nowrap;display: flex;align-items: center;justify-content: center;border-radius: 0.5rem;background-color: #000000;border: 1px solid #444444;color: #dbdbdb;}
    .overlayYearLandscape svg {position: relative;left: -0.5rem}
    .overlayTimeLandscape {height: 3.2rem;grid-column: 4;grid-row: 1;padding: 0.5rem 1rem;margin: 0 0.5rem 0 0.5rem;white-space: nowrap;display: flex;align-items: center;justify-content: center;border-radius: 0.5rem;background-color: #000000;border: 1px solid #444444;color: #dbdbdb;}
    .overlayTimeLandscape svg {position: relative;left: -0.5rem}
    .spacer1Landscape {grid-column: 5;grid-row: 1;}
    .overlayDownloadImageLandscape {height: 3.2rem;grid-column: 6;grid-row: 1;padding: 0.5rem 1rem;margin: 0 0.5rem 0 0.5rem;white-space: nowrap;display: flex;align-items: center;justify-content: center;border-radius: 0.5rem;background-color: #000000;border: 1px solid #444444;cursor: pointer;color: #dbdbdb;transition: all 0.6s;}
    .overlayDownloadImageLandscape svg {position: relative;left: -0.5rem}
    .overlayDownloadImageLandscape:hover {transform: scale(0.95);background-color: #cccccc;color: #000000;}
    .overlayDownloadImageLandscape:active {transform: scale(0.96);}
    .overlayDownloadNFOLandscape {height: 3.2rem;grid-column: 7;grid-row: 1;padding: 0.5rem 1rem;margin: 0 0.5rem 0 0.5rem;white-space: nowrap;display: flex;align-items: center;justify-content: center;border-radius: 0.5rem;background-color: #000000;border: 1px solid #444444;cursor: pointer;transition: all 0.6s;}
    .overlayDownloadNFOLandscape svg {position: relative;left: -0.5rem}
    .overlayDownloadNFOLandscape:hover {transform: scale(0.95);background-color: #cccccc;color: #000000;}
    .overlayDownloadNFOLandscape:active {transform: scale(0.96);}
    .exitButtonLandscape {width: 3.2rem;height: 3.2rem;margin: 0 1rem 0 0.5rem;grid-column: 8;grid-row: 1;white-space: nowrap;display: flex;align-items: center;justify-content: center;border-radius: 0.5rem;background-color: #000000;border: 1px solid #444444;cursor: pointer;transition: all 0.6s;}
    .exitButtonLandscape:hover {transform: scale(0.95);background-color: #cccccc;color: #000000;}
    .exitButtonLandscape:active {transform: scale(0.96);}
    .overlayTitleLandscape {grid-column: 1 / span 8;grid-row: 2;padding: 0.5rem 1rem;font-family: FuturaHand;font-size: 5rem;font-weight: bolder;text-align: center;line-height: 5rem;}
    .overlayPlotLandscape {grid-column: 1 / span 8;grid-row: 3;text-align: justify;padding: 1rem;margin: 1rem;border-radius: 0.5rem;background-color: #000000;border: 1px solid #444444;line-height: 1.5rem;font-size: 0.8rem;font-family: Verdana, Geneva, Tahoma, sans-serif;}

    .overlayWindowPortrait {width: 100vw;height: 100vh;position: fixed;inset: 0;background-color: #000000cc;z-index: 1000;overflow: hidden;padding: 0;margin: 0;display: grid;grid-template-columns: auto;grid-template-rows: auto;}
    .overlayImagePortrait {grid-column: 1;grid-row: 1;width: 100vw;}
    .overlayImagePortrait img {width: 100%;height: auto;}
    .overlayContainerPortrait {width: 100vw;height: 100vh;grid-column: 1;grid-row: 1;background: linear-gradient(180deg, #000000cc, #000000cc, #000000ff, #000000ff, #000000ff);display: grid;grid-template-columns: auto;grid-template-rows: min-content auto min-content;place-items: center;}
    .overlayInfo1Portrait {width: 100vw;height: min-content;grid-column: 1;grid-row: 1;background-color: #00000000;display: grid;grid-template-columns: min-content min-content auto min-content;grid-template-rows: 4rem auto min-content;place-items: center;font-size: 1rem;color: #dbdbdb;}
    .overlayDownloadImagePortrait {height: 3rem;grid-column: 1;grid-row: 1;padding: 0.5rem 1rem;margin: 0 0.5rem 0 0.5rem;white-space: nowrap;display: flex;align-items: center;justify-content: center;border-radius: 0.5rem;background-color: #000000;border: 1px solid #444444;cursor: pointer;color: #dbdbdb;transition: all 0.6s;}
    .overlayDownloadImagePortrait svg {position: relative;left: -0.5rem}
    .overlayDownloadImagePortrait:hover {transform: scale(0.95);background-color: #cccccc;color: #000000;}
    .overlayDownloadImagePortrait:active {transform: scale(0.96);}
    .overlayDownloadNFOPortrait {height: 3rem;grid-column: 2;grid-row: 1;padding: 0.5rem 1rem;margin: 0 0.5rem 0 0;white-space: nowrap;display: flex;align-items: center;justify-content: center;border-radius: 0.5rem;background-color: #000000;border: 1px solid #444444;cursor: pointer;transition: all 0.6s;}
    .overlayDownloadNFOPortrait svg {position: relative;left: -0.5rem}
    .overlayDownloadNFOPortrait:hover {transform: scale(0.95);background-color: #cccccc;color: #000000;}
    .overlayDownloadNFOPortrait:active {transform: scale(0.96);}
    .spacer1Portrait {grid-column: 3;grid-row: 1;}
    .exitButtonPortrait {width: 3rem;height: 3rem;margin: 0 0.5rem 0 0;grid-column: 4;grid-row: 1;white-space: nowrap;display: flex;align-items: center;justify-content: center;border-radius: 0.5rem;background-color: #000000;border: 1px solid #444444;cursor: pointer;transition: all 0.6s;}
    .exitButtonPortrait:hover {transform: scale(0.95);background-color: #cccccc;color: #000000;}
    .exitButtonPortrait:active {transform: scale(0.96);}
    .overlayTitlePortrait {grid-column: 1;grid-row: 2;padding: 0.5rem 1rem;font-family: FuturaHand;font-size: 3rem;font-weight: bolder;text-align: center;line-height: normal;}
    .overlayInfo2Portrait {width: 100vw;height: min-content;grid-column: 1;grid-row: 3;background-color: #00000000;display: grid;grid-template-columns: min-content min-content min-content auto min-content;grid-template-rows: 4rem min-content;place-items: center;font-size: 1rem;color: #dbdbdb;}
    .overlayNumberPortrait {height: 3rem;grid-column: 1;grid-row: 1;padding: 0 1rem;margin: 0 0.5rem 0 0.5rem;white-space: nowrap;display: flex;align-items: center;justify-content: center;border-radius: 0.5rem;background-color: #000000;border: 1px solid #444444;color: #dbdbdb;}
    .overlayNumberPortrait svg {position: relative;left: -0.5rem}
    .overlayYearPortrait {height: 3rem;grid-column: 2;grid-row: 1;padding: 0 1rem;margin: 0 0.5rem 0 0;white-space: nowrap;display: flex;align-items: center;justify-content: center;border-radius: 0.5rem;background-color: #000000;border: 1px solid #444444;color: #dbdbdb;}
    .overlayYearPortrait svg {position: relative;left: -0.5rem}
    .overlayTimePortrait {height: 3rem;grid-column: 3;grid-row: 1;padding: 0 1rem;margin: 0 0.5rem 0 0;white-space: nowrap;display: flex;align-items: center;justify-content: center;border-radius: 0.5rem;background-color: #000000;border: 1px solid #444444;color: #dbdbdb;}
    .overlayTimePortrait svg {position: relative;left: -0.5rem}
    .spacer2Portrait {grid-column: 4;grid-row: 1;}
    .overlayFSKPortrait {width: 4.8rem;height: 4.8rem;grid-column: 5;grid-row: 1;margin: 0 -0.4rem 0 0;}.overlayFSKPortrait img {width: 100%;height: 100%;}
    .overlayPlotPortrait {grid-column: 1 / span 5;grid-row: 2;text-align: justify;padding: 1rem;margin: 0 0.5rem 0.5rem 0.5rem;border-radius: 0.5rem;background-color: #000000;border: 1px solid #444444;line-height: normal;font-size: 0.7rem;font-family: Verdana, Geneva, Tahoma, sans-serif;}
  </style>

</head>

<script src="../../assets/js/jquery.min.js"></script>
<script src="../../assets/js/browser.min.js"></script>
<script src="../../assets/js/breakpoints.min.js"></script>
<script src="../../assets/js/util.js"></script>
<script src="../../assets/js/main.js"></script>
<script>
  let current_data = [];
  let current_group = 'Name';
  let current_sort_direction = 'asc';

  async function load_moviebase() {
    try {const response = await fetch("movies.json");if (!response.ok) throw new Error("movies.json konnte nicht geladen werden.");current_data = await response.json();load_navigation();load_table_data(current_data);}
    catch(err) {document.getElementById("output").innerHTML = "<h3>Fehler</h3><p>" + err.message + "</p>";console.error(err);}
  }

  function load_navigation() {
    const sortContainer = document.createElement('div');
    sortContainer.className = 'sortContainer';
    const groups_container = document.createElement('nav');
    groups_container.id = 'group_button_container';
    const group_description = ['Nummer', 'Name', '0-9', ...'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split(''), 'Zufall'];
    group_description.forEach(z => {
      const btn = document.createElement('button');
      const group_button_text = document.createElement('span');
      group_button_text.className = 'button_text';
      group_button_text.textContent = z;
      const sort_arrow_symbol = document.createElement('span');
      sort_arrow_symbol.className = 'sort_arrow';
      sort_arrow_symbol.textContent = '  ';
      btn.appendChild(group_button_text);
      btn.appendChild(sort_arrow_symbol);
      btn.onclick = () => {
        const same_group = current_group === z;
        if (z === 'Zufall') {
          const random_movie = [current_data[Math.floor(Math.random() * current_data.length)]];
          current_group = 'Zufall';current_sort_direction = 'asc';load_table_data(random_movie, 'Zufall');show_group('Zufall');set_group_active();
        }
        else {
          if (same_group) {current_data.reverse();current_sort_direction = current_sort_direction === 'asc' ? 'desc' : 'asc';}
          else {current_group = z;current_sort_direction = 'asc';
            current_data.sort((a, b) => {
              if (z === 'Nummer') {const numA = parseInt(a[Object.keys(a)[0]]) || 0;const numB = parseInt(b[Object.keys(b)[0]]) || 0;return numA - numB;}
              else {const nameA = String(a[Object.keys(a)[1]] ?? '');const nameB = String(b[Object.keys(b)[1]] ?? '');return nameA.localeCompare(nameB, 'de');}
            });
          }
          load_table_data(current_data, z);set_group_active();
        }
      };
      groups_container.appendChild(btn);
    });

    const article = document.querySelector('article#mb_movie_base');
    article.insertBefore(groups_container, document.getElementById('output'));

    setTimeout(() => {
      const buttons = document.querySelectorAll('#group_button_container button');
      let maxWidth = 0;
      buttons.forEach(btn => {const width = btn.offsetWidth;if (width > maxWidth) maxWidth = width;});
      buttons.forEach(btn => {btn.style.width = maxWidth + 'px';});
    }, 0);

    const search_container_object = document.createElement('div');
    search_container_object.id = 'search_container';
    search_container_object.style.margin = '1em 0';
    const search_input = document.createElement('input');
    search_input.type = 'text';
    search_input.placeholder = 'Suche nach Titel...';
    search_input.id = 'search_input';
    search_input.style.padding = '0.5em';
    search_input.style.width = '100%';
    search_input.style.maxWidth = '100%';
    search_input.addEventListener('input', function () {search_in_table_data(this.value);});
    search_container_object.appendChild(search_input);
    article.insertBefore(search_container_object, document.getElementById('output'));
  }

  function load_table_data(data, group_extra = null) {
    const container = document.getElementById('output');container.innerHTML = '';
    const groups = {
      'Nummer': [], 'Name': [], 'Zufall': [], '0-9': [],
      ...Object.fromEntries('ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('').map(c => [c, []]))
    };
    for (const entry of data) {
      const name = entry.title ?? "";
      const letter_1 = name.charAt(0).toUpperCase();
      groups['Name'].push(entry);
      groups['Zufall'].push(entry);
      groups['Nummer'].push(entry);
      if (/[0-9]/.test(letter_1)) {groups['0-9'].push(entry);}
      else if (groups[letter_1]) {groups[letter_1].push(entry);}
    }

    for (const group_single in groups) {
      const groupDiv = document.createElement('div');
      groupDiv.id = 'group_single_' + group_single;
      groupDiv.className = 'group_button';
      if (group_single === (group_extra || 'Name')) {groupDiv.classList.add('aktiv');}
      let data = groups[group_single];
      if (group_single === 'Nummer') {
        data.sort((a, b) => {
          const numA = parseInt(a.id) || 0;
          const numB = parseInt(b.id) || 0;
          return current_sort_direction === 'asc' ? numA - numB : numB - numA;
        });
      }
      else if (group_single !== 'Zufall') {
        data.sort((a, b) => {
          const nameA = a.title ?? "";
          const nameB = b.title ?? "";
          return current_sort_direction === 'asc'
            ? nameA.localeCompare(nameB, 'de')
            : nameB.localeCompare(nameA, 'de');
        });
      }
      if (data.length > 0) {const table = generate_table_data(data);groupDiv.appendChild(table);}
      else {groupDiv.innerHTML = '<p>Keine Einträge gefunden...</p>';}
      container.appendChild(groupDiv);
    }
  }

  function set_group_active() {
    document.querySelectorAll('#group_button_container button').forEach(btn => {
      const group_button_text = btn.querySelector('.button_text');
      const sort_arrow_symbol_span = btn.querySelector('.sort_arrow');
      const text = group_button_text.textContent;
      btn.classList.remove('active-group');
      if (text === current_group) {btn.classList.add('active-group');sort_arrow_symbol_span.textContent = (text === 'Zufall') ? '' : (current_sort_direction === 'asc' ? '▼' : '▲');}
      else {sort_arrow_symbol_span.textContent = '  ';}
    });
  }

  function show_group(group_single) {
    current_group = group_single;
    document.querySelectorAll('.group_button').forEach(div => {div.classList.remove('aktiv');});
    const aktiv = document.getElementById('group_single_' + group_single);
    if (aktiv) aktiv.classList.add('aktiv');
    set_group_active();
  }

  function generate_table_data(data) {
    const cardContainer = document.createElement("div");
    cardContainer.className = "cardContainer";
    data.forEach(row => {
      const card = document.createElement("div");
      card.className = "movieCard";
      card.dataset.title = (row.title ?? "").toLowerCase();

      const moviePoster = document.createElement("div");
      moviePoster.className = "moviePoster";
      moviePoster.innerHTML = '<img src="' + row.poster + '" loading="lazy">';
      
      const movieNumber = document.createElement("div");
      movieNumber.className = "movieNumber";
      movieNumber.innerHTML = '<svg height="24px" viewBox="0 -960 960 960" width="24px" fill="currentColor"><path d="m240-160 40-160H120l20-80h160l40-160H180l20-80h160l40-160h80l-40 160h160l40-160h80l-40 160h160l-20 80H660l-40 160h160l-20 80H600l-40 160h-80l40-160H360l-40 160h-80Zm140-240h160l40-160H420l-40 160Z"/></svg>' + row.id ?? "";
      
      const movieYear = document.createElement("div");
      movieYear.className = "movieYear";
      movieYear.innerHTML = '<svg height="24px" viewBox="0 -960 960 960" width="24px" fill="currentColor"><path d="M200-80q-33 0-56.5-23.5T120-160v-560q0-33 23.5-56.5T200-800h40v-80h80v80h320v-80h80v80h40q33 0 56.5 23.5T840-720v560q0 33-23.5 56.5T760-80H200Zm0-80h560v-400H200v400Zm0-480h560v-80H200v80Zm0 0v-80 80Z"/></svg>' + row.year ?? "";
      
      const overlay = document.createElement("div");
      overlay.className = "movieOverlay";
      overlay.onclick = () => createOverlay(row);
      
      card.appendChild(moviePoster);
      card.appendChild(movieNumber);
      card.appendChild(movieYear);
      card.appendChild(overlay);
      
      cardContainer.appendChild(card);
    });
    return cardContainer;
  }

  function search_in_table_data(search_index) {
    const group_div = document.getElementById("group_single_" + current_group);
    if (!group_div) return;
    const cards = group_div.querySelectorAll(".movieCard");
    const search = search_index.trim().toLowerCase();
    cards.forEach(card => {
      const title = card.dataset.title;
      card.style.display = (search === "" || title.includes(search)) ? "" : "none";
    });
  }

  function createOverlay(movie) {
    let windowMode = "";
    if (window.innerWidth >= window.innerHeight) {windowMode = "landscape";}
    else {windowMode = "portrait";}

    const overlayWindow = document.createElement("div");
    const overlayImage = document.createElement("div");
    const overlayContainer = document.createElement("div");
    const overlayInfo1 = document.createElement("div");
    const overlayInfo2 = document.createElement("div");
    const overlayFSK = document.createElement("div");
    const overlayNumber = document.createElement("div");
    const overlayYear = document.createElement("div");
    const overlayTime = document.createElement("div");
    const overlayDownloadImage = document.createElement("div");
    const overlayDownloadNFO = document.createElement("div");
    const exitButton = document.createElement("div");
    const overlayTitle = document.createElement("div");

  function downloadNFO(movie) {downloadFile(`Movies/${movie.folder}/${movie.filename}.nfo`, `${movie.filename}.nfo`);}
  function downloadFile(url, filename) {
    const link = document.createElement("a");
    link.href = url;
    link.download = filename;
    link.style.display = "none";
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
  }
