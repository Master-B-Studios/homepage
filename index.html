<html>
    <head>
    <title>MB Movie-Base</title>
    <meta charset="utf-8"></meta>
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no"></meta>
    <link rel="icon" type="image/x-icon" href="../homepage/images/MB_Icon_02.svg"></link>
    <style>
      body {width: 100vw;height: 100vh;display: grid;grid-template-columns: min-content auto;grid-template-rows: 100vh;background-color: #000000;margin: 0;padding: 0;overflow: hidden;color: #dbdbdb;font-size: 1rem;font-family: Arial, Helvetica, sans-serif;-webkit-tap-highlight-color: transparent;}
      .sidebar {grid-column: 1;grid-row: 1;display: grid;grid-template-columns: min-content;grid-template-rows: min-content min-content min-content min-content min-content min-content min-content min-content min-content min-content min-content min-content min-content;background: linear-gradient(50deg, #22222299, #11111144, #22222299, #11111144);border-right: 0.01rem solid #999999;overflow-y: scroll;}
      .sidebar a {height: 3rem;display: flex;align-items: center;justify-content: left;margin: 0.5rem 0.5rem 0 0.5rem;padding: 0 1rem 0 0.5rem;background: linear-gradient(50deg, #222222, #111111, #222222, #111111, #222222);border-radius: 1rem;border: 0.01rem solid #99999900;text-decoration: none;color: #999999;white-space: pre;cursor: pointer;transition: all 0.6s;}
      .sidebar a:hover {color: #dbdbdb;border-color: #dbdbdb;background: linear-gradient(50deg, #1e361e, #081a04, #1e361e, #081a04, #1e361e);}
      .sidebar a svg {margin: 0 0.5rem 0 0;}
      .sidebarSpacer {height: 3rem;}
      .sidebarToggle {display: none;}

      .main {grid-column: 2;grid-row: 1;position: relative;display: grid;grid-template-columns: auto;grid-template-rows: min-content min-content min-content;background: linear-gradient(50deg, #22222299, #33333344, #22222299, #33333344);overflow-y: scroll;place-items: center;}

	  .mbLogo {grid-column: 1;grid-row: 1;width: 100%;margin: auto;}
	  .mbLogo img {width: 100%;}

	  .cardContainer {display: grid;grid-template-columns: repeat(auto-fill, minmax(12rem, 1fr));gap: 1rem;margin: 1rem;}
      .card {color: #dbdbdb;width: auto;height: auto;display: grid;grid-template-columns: auto;grid-template-rows: min-content min-content;border-radius: 1rem;border: 0.01rem solid #444444;color: #999999;text-decoration: none;position: relative;top: 0;margin: 0;cursor: pointer;transition: all 0.6s;}
	  .card img {grid-column: 1;grid-row: 1;width: 100%;display: flex;justify-content: center;align-items: center;border-radius: 1rem 1rem 0 0;transition: all 0.6s;}
	  .card div {grid-column: 1;grid-row: 2;width: 100%;margin: 0.5rem 0;display: flex;align-items: center;justify-content: center;color: #999999;transition: all 0.6s;}
      .card:hover {border-color: #999999;top: -0.5rem;color: #dbdbdb;}
	  .card:hover div {color: #dbdbdb;}

      @media (max-width: 600px) {
        body {grid-template-columns: 1fr;}
        .main {grid-column: 1;}
        .sidebar {position: fixed;top: 0;left: 0;height: 100vh;max-width: 60vw;z-index: 2000;transform: translateX(-100%);transition: transform 0.6s ease;background-color: #000000ee;box-shadow: 0 0 1rem #00000099;}
        .sidebar.open {transform: translateX(0);}
        .sidebarToggle {display: flex;position: fixed;top: 0.5rem;right: 0.5rem;z-index: 1001;width: 3rem;height: 3rem;align-items: center;justify-content: center;color: #dbdbdb;background-color: #000000cc;border: 0.01rem solid #999999;border-radius: 1rem;font-size: 1.5rem;cursor: pointer;}

        .sortOverlay {grid-column: 1;grid-row: 1;padding: 0.5rem;}
        .cardContainer {grid-template-columns: repeat(auto-fill, minmax(40vw, 1fr));gap: 1rem;margin: 0.5rem;}
        .cardContainer.open {width: calc(50vw - 1rem); margin: 0.5rem 0.5rem 0 calc(50vw + 0.5rem);}
        #groupContainerZufall .cardContainer {width: calc(50vw - 1rem); margin: 4rem 0.5rem 0 calc(50vw + 0.5rem);}

        .movieOverlay {width: 100vw;grid-column: 1;padding: 0.5rem;align-items: baseline;overflow-y: scroll;}
        .movieOverlayContent {margin: 0;grid-template-columns: min-content auto min-content;grid-template-rows: min-content min-content min-content min-content min-content min-content min-content min-content;}

        .overlayFSK {grid-column: 1;grid-row: 1;margin: 0.5rem 0 0 0.5rem;}
        .spacer1 {grid-column: 2;grid-row: 1;height: 3rem;}
        .movieOverlayExitButton {grid-column: 3;grid-row: 1;margin: 0.5rem 0.5rem 0 0;}
        .movieOverlayTitle {grid-column: 1 / span 3;grid-row: 2;}
        .movieOverlayPoster {grid-column: 2 / span 2;grid-row: 3 / span 5;margin: 0.5rem;} 
        .overlayNumber {grid-column: 1;grid-row: 3;margin: 0.5rem 0 0 0.5rem;}
        .overlayYear {grid-column: 1;grid-row: 4;margin: 0.5rem 0 0 0.5rem;}
        .overlayTime {grid-column: 1;grid-row: 5;margin: 0.5rem 0 0 0.5rem;}
        .movieOverlayDownloadImage {grid-column: 1;grid-row: 6;margin: 0.5rem 0 0 0.5rem;}
        .movieOverlayDownloadNFO {grid-column: 1;grid-row: 7;margin: 0.5rem 0 0 0.5rem;}
        .movieOverlayPlot {grid-column: 1 / span 3;grid-row: 8;margin: 0.5rem;}
      }

      @media (orientation: landscape) and (max-height: 500px) {
        .sortOverlay {padding: 0.5rem;align-items: baseline;overflow-y: scroll;}
        .cardContainer {grid-template-columns: repeat(auto-fill, minmax(20vw, 1fr));gap: 1rem;margin: 0.5rem;}

        .movieOverlay {grid-column: 2;padding: 0.5rem;align-items: baseline;overflow-y: scroll;}
        .movieOverlayContent {margin: 0;grid-template-columns: auto auto min-content;grid-template-rows: min-content min-content min-content min-content min-content min-content min-content min-content;}
        .overlayFSK {grid-column: 1;grid-row: 1;margin: 0.5rem 0 0 0.5rem;}
        .spacer1 {grid-column: 2;grid-row: 1;height: 3rem;}
        .movieOverlayExitButton {grid-column: 3;grid-row: 1;margin: 0.5rem 0.5rem 0 0;}
        .movieOverlayTitle {grid-column: 1 / span 3;grid-row: 2;}
        .movieOverlayPoster {grid-column: 2 / span 2;grid-row: 3 / span 5;margin: 0.5rem;} 
        .overlayNumber {grid-column: 1;grid-row: 3;margin: 0.5rem 0 0 0.5rem;}
        .overlayYear {grid-column: 1;grid-row: 4;margin: 0.5rem 0 0 0.5rem;}
        .overlayTime {grid-column: 1;grid-row: 5;margin: 0.5rem 0 0 0.5rem;}
        .movieOverlayDownloadImage {grid-column: 1;grid-row: 6;margin: 0.5rem 0 0 0.5rem;}
        .movieOverlayDownloadNFO {grid-column: 1;grid-row: 7;margin: 0.5rem 0 0 0.5rem;}
        .movieOverlayPlot {grid-column: 1 / span 3;grid-row: 8;margin: 0.5rem;}
      }
  </style>
